[workspace]
resolver = "3"
members = [
  "desktop/app",
  "desktop/crates/*",
  "desktop/connectors/filesystem",
  "desktop/connectors/code-editor",
  "desktop/connectors/shell",
  "desktop/connectors/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/oljodev/gantry"
homepage = "https://oljo.dev"
rust-version = "1.93"
publish = false

[workspace.dependencies]
# Gantry crates
gantry-core = { path = "desktop/crates/gantry-core" }
gantry-store = { path = "desktop/crates/gantry-store" }
gantry-secrets = { path = "desktop/crates/gantry-secrets" }
gantry-providers = { path = "desktop/crates/gantry-providers" }
gantry-connectors = { path = "desktop/crates/gantry-connectors" }
gantry-workspace = { path = "desktop/crates/gantry-workspace" }
gantry-agent = { path = "desktop/crates/gantry-agent" }
gantry-connector-filesystem = { path = "desktop/connectors/filesystem" }
gantry-connector-code-editor = { path = "desktop/connectors/code-editor" }
gantry-connector-shell = { path = "desktop/connectors/shell" }
gantry-connector-web = { path = "desktop/connectors/web" }

# Shared third-party versions. Pin here, inherit everywhere.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "ulid"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
