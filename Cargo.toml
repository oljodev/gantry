[workspace]
resolver = "3"
members = [
  "desktop/app",
  "desktop/crates/*",
  "desktop/connectors/filesystem",
  "desktop/connectors/code-editor",
  "desktop/connectors/media",
  "desktop/connectors/shell",
  "desktop/connectors/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/oljodev/gantry"
homepage = "https://gantry.oljo.dev"
rust-version = "1.93"
publish = false

[workspace.dependencies]
# Gantry crates
gantry-core = { path = "desktop/crates/gantry-core" }
gantry-store = { path = "desktop/crates/gantry-store" }
gantry-secrets = { path = "desktop/crates/gantry-secrets" }
gantry-providers = { path = "desktop/crates/gantry-providers" }
gantry-connectors = { path = "desktop/crates/gantry-connectors" }
gantry-workspace = { path = "desktop/crates/gantry-workspace" }
gantry-documents = { path = "desktop/crates/gantry-documents" }
gantry-agent = { path = "desktop/crates/gantry-agent" }
gantry-connector-filesystem = { path = "desktop/connectors/filesystem" }
gantry-connector-code-editor = { path = "desktop/connectors/code-editor" }
gantry-connector-shell = { path = "desktop/connectors/shell" }
gantry-connector-media = { path = "desktop/connectors/media" }
gantry-connector-web = { path = "desktop/connectors/web" }

# Shared third-party versions. Pin here, inherit everywhere.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "ulid", "serde_json"] }
specta-typescript = "0.0.12"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1"
log = "0.4"
ulid = { version = "1", features = ["serde"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "=2.5.0"
keyring-core = "1"
secrecy = "0.10"
zeroize = "1"
chacha20poly1305 = "0.11"
getrandom = "0.3"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
url = "2.5"
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
tokio-util = "0.7"
tempfile = "3"
sha2 = "0.10"
cap-std = "4"
diffy = "0.5"
ignore = "0.4"
globset = "0.4"
regex = "1"
trash = "5"
pdf-extract = "0.12"
# Matching what pdf-extract resolves, so the document crate and its extractor share one copy.
lopdf = { version = "0.42", default-features = false }
toml = "0.9"
shell-words = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
