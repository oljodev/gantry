# cargo-deny configuration. Run `cargo deny check` (CI does).

[graph]
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Tauri's Linux stack sits on the gtk-rs GTK3 bindings, which RustSec lists as unmaintained
# (RUSTSEC-2024-0411…0420), alongside a few proc-macro helpers. Only Gantry's own direct
# dependencies are held to the unmaintained rule; vulnerabilities are still checked everywhere.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Gantry's own crates are FSL-1.1-ALv2 and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
