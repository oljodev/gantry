[package]
name = "gantry-connector-shell"
description = "First-party connector: Shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gantry-core.workspace = true
gantry-connectors.workspace = true
gantry-workspace.workspace = true
async-trait.workspace = true
# PowerShell is handed its script as base64 UTF-16 rather than as an argument (env.rs).
base64.workspace = true
log.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "macros", "rt"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
# For one call: signalling the process *group*, so a kill takes the children with it. The safe
# wrapper is why this is a dependency rather than an unsafe block in a crate that forbids them.
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
gantry-store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
