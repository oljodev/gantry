[package]
name = "gantry-connector-media"
description = "First-party connector: Media generation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gantry-core.workspace = true
gantry-connectors.workspace = true
# The endpoints, the model catalog and the key: this connector adds no provider code of its
# own. `POST /images`, `/audio/speech` and `/videos` are already behind `Provider::stream`
# (02 §4b), and calling a media model through the same trait the chat loop uses is what keeps
# one implementation of each rather than two.
gantry-providers.workspace = true
gantry-store.workspace = true
async-trait.workspace = true
futures-util.workspace = true
log.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt", "sync"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
