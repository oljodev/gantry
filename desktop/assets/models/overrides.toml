# Model capabilities and pricing the provider APIs do not expose (docs/plan/02 §2).
#
# One [[model]] table per entry. `provider` is an account id (anthropic, openai, google, xai,
# openrouter, custom) or a client kind (anthropic, openai_responses, openai_chat, gemini).
# `id` is exact or a prefix ending in `*`. Entries apply in file order: put the pattern first
# and the specific model after it. Prices are US dollars per million tokens. Only the fields an
# entry sets are changed.
#
# Fields: display_name, context_window, max_output, thinking (true | false | "effort" |
# "budget"), web_search, tools, parallel_tools, streams_tool_args, vision, pdf_input,
# structured_output, prompt_caching ("explicit" | "automatic" | "none"),
# input_price_per_mtok, output_price_per_mtok, cache_read_price_per_mtok.

# ---------------------------------------------------------------------------------------------
# Anthropic (Messages API). Thinking is a token budget up to 4.5 and adaptive from 4.6 on;
# both take the chat's effort setting. Every current model streams tool arguments, reads
# images and PDFs, runs the web search tool and caches explicit prefixes.
# ---------------------------------------------------------------------------------------------

[[model]]
provider = "anthropic"
id = "claude-*"
context_window = 200000
max_output = 32000
thinking = "budget"
web_search = true
tools = true
parallel_tools = true
streams_tool_args = true
vision = true
pdf_input = true
structured_output = true
prompt_caching = "explicit"

[[model]]
provider = "anthropic"
id = "claude-3-5-haiku*"
thinking = false
pdf_input = false
max_output = 8192
input_price_per_mtok = 0.8
output_price_per_mtok = 4.0
cache_read_price_per_mtok = 0.08

[[model]]
provider = "anthropic"
id = "claude-haiku-4-5*"
