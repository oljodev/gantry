[package]
name = "gantry-app"
description = "The Gantry desktop application (Tauri)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "gantry_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
gantry-agent.workspace = true
base64.workspace = true
gantry-connectors.workspace = true
gantry-connector-code-editor.workspace = true
gantry-connector-filesystem.workspace = true
gantry-core.workspace = true
gantry-providers.workspace = true
gantry-secrets.workspace = true
gantry-store.workspace = true
gantry-workspace.workspace = true
tokio.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.9"
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-os = "2.3"
log = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
