name: gantry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: gantry
      POSTGRES_DB: gantry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantry -d gantry"]
      interval: 2s
      timeout: 3s
      retries: 15
    command:
      # Queue workloads at high worker counts need headroom over PG defaults.
      - "postgres"
      - "-c"
      - "max_connections=200"

  worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      GANTRY_DATABASE_URL: postgresql+asyncpg://gantry:gantry@postgres:5432/gantry
      GANTRY_DEFAULT_MODEL: ${GANTRY_DEFAULT_MODEL:-anthropic/claude-opus-4-8}
      GANTRY_GITHUB_TOKEN: ${GANTRY_GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /workspaces  # ephemeral by design: durability lives in the event log

volumes:
  pgdata:
