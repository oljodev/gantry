name: Release

# A version tag builds Gantry for Linux and Windows, gives the bundles the stable names the
# website's download buttons point at (web/site/src/scripts/releases.ts), and puts them on a
# **draft** release with their checksums and the third-party notices. Nothing is public until
# the draft is published by hand, and publishing is what turns every download button on: the
# site asks for `releases/latest`, which never answers with a draft.
#
# To release version X.Y.Z:
#
# 1. The repository is public. This workflow is skipped while it is private, for the reason
#    build.yml gives, so a tag pushed before then does nothing.
# 2. `version` is X.Y.Z in desktop/app/tauri.conf.json, the root Cargo.toml and
#    desktop/frontend/package.json; `cargo xtask licenses` has been run and committed; and
#    web/site/src/content/changelog/<date>-X.Y.Z.md is written (its body becomes the notes).
# 3. `git tag vX.Y.Z && git push origin vX.Y.Z`, from a commit on main.
# 4. Read the draft on GitHub, then Publish.
#
# Re-running from the same tag ("Run workflow", choosing the tag) replaces the files on a draft
# and leaves its notes alone, in case they were edited there. A published release is never
# touched: a fix is a new version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag, the app and the crates agree on the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this from a version tag (vX.Y.Z), not $GITHUB_REF"; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          app=$(jq -r .version desktop/app/tauri.conf.json)
          crates=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          frontend=$(jq -r .version desktop/frontend/package.json)
          echo "tag $tag · tauri.conf.json $app · Cargo.toml $crates · frontend $frontend"
          if [ "$tag" != "$app" ] || [ "$tag" != "$crates" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::The tag says $tag; set every version to it before tagging"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      # A release is both platforms or neither.
      fail-fast: true
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile && pnpm fonts

      # Once, on the platform the generator runs on. The file is the same for both builds: it
      # lists the dependencies of both targets.
      - name: The third-party notices describe this dependency graph
        if: matrix.name == 'Linux'
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.2
          cargo xtask licenses --check

      - name: Build
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Stable names
        shell: bash
        run: |
          # Exactly one bundle of each kind, whatever Tauri calls it this version.
          one() {
            local found=( $1 )
            if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}" ]; then
              echo "::error::expected one file matching $1, found: ${found[*]}"
              exit 1
            fi
            cp "${found[0]}" "out/$2"
            echo "$2 ← ${found[0]}"
          }
          bundle=target/release/bundle
          mkdir out
          if [ "${{ matrix.name }}" = Linux ]; then
            one "$bundle/appimage/*.AppImage" Gantry-Linux-x86_64.AppImage
            one "$bundle/deb/*.deb" Gantry-Linux-x86_64.deb
            one "$bundle/rpm/*.rpm" Gantry-Linux-x86_64.rpm
          else
            one "$bundle/nsis/*-setup.exe" Gantry-Windows-x64.exe
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Notices and checksums
        run: |
          cp THIRD_PARTY_LICENSES.md out/
          cd out
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Notes
        run: |
          shopt -s nullglob
          entries=(web/site/src/content/changelog/*-"$VERSION".md)
          if [ "${#entries[@]}" -eq 1 ]; then
            # The changelog entry without its front matter.
            awk 'n >= 2 { print } /^---$/ { n++ }' "${entries[0]}" > notes.md
          else
            echo "::warning::No changelog entry for $VERSION; the draft says so until its notes are written"
            echo "Notes for this version are not written yet. Edit this draft before publishing." > notes.md
          fi
          cat >> notes.md <<'EOF'

          ---

          **Linux:** make the AppImage executable (`chmod +x Gantry-Linux-x86_64.AppImage`) and run it; the `.deb` and `.rpm` use the system's WebKitGTK instead of carrying their own. **Windows:** the installer is not signed yet, so SmartScreen stops it the first time — choose **More info**, then **Run anyway**.

          `SHA256SUMS` has a checksum for every file here, and `THIRD_PARTY_LICENSES.md` the notices of everything Gantry is built on.
          EOF

      - name: Draft
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$tag is already published, and a published release is not rewritten. Tag a new version."
              exit 1
            fi
            gh release upload "$tag" out/* --clobber
            echo "Replaced the files on the draft for $tag; its notes are unchanged."
          else
            gh release create "$tag" out/* --draft --verify-tag --title "Gantry $VERSION" --notes-file notes.md
          fi
