name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile && pnpm fonts

      - name: Format (Rust)
        run: cargo fmt --all --check

      - name: Format (frontend)
        run: pnpm format:check

      - name: Lint (frontend)
        run: pnpm lint

      - name: Design tokens contrast
        run: pnpm design:contrast

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (includes the bindings drift check)
        run: cargo test --workspace

  # Its own runner, because it needs none of the above and cannot survive beside it: the step
  # installs a toolchain of its own, and sharing a runner that already holds the built workspace
  # left 25 MB free and died with "No space left on device" (2026-09-10). It reads Cargo.lock,
  # nothing more, so it is also the fastest job here.
  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
