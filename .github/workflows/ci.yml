name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Checks
    # Skipped while the repository is private, because the account's Actions minutes are spent
    # and every job GitHub refuses to start is a failed run and an email about it. A skipped job
    # is a clean run and costs nothing. Making the repository public turns CI back on by itself:
    # Actions is free on standard runners for public repositories, so there is nothing to
    # remember to flip back (docs/plan/09 M0).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile && pnpm fonts

      - name: Format (Rust)
        run: cargo fmt --all --check

      - name: Format (frontend)
        run: pnpm format:check

      - name: Lint (frontend)
        run: pnpm lint

      - name: Design tokens contrast
        run: pnpm design:contrast

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (includes the bindings drift check)
        run: cargo test --workspace

      # The Windows build, from a Linux runner. `cargo check` never links, so a Windows machine
      # is not needed to prove that every `#[cfg(windows)]` block still compiles — which is the
      # thing that rots silently, because nobody here builds for Windows between releases
      # (docs/dev/setup.md). It proves nothing about behaviour; the Windows job in build.yml is
      # what runs anything.
      - name: Windows type-check
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo run -p xtask -- check-windows --clippy

      # The catalogue describes other people's servers, so these two check that it still agrees
      # with what those servers last said (17 §5). No network: the probe reads the fixtures that
      # were committed beside each manifest, which is what makes a manifest edit that contradicts
      # the real server a failing build rather than something a user discovers.
      - name: Connector catalogue
        run: |
          cargo run -p xtask -- validate-connectors
          cargo run -p xtask -- probe-connectors --offline

  # Its own runner, because it needs none of the above and cannot survive beside it: the step
  # installs a toolchain of its own, and sharing a runner that already holds the built workspace
  # left 25 MB free and died with "No space left on device" (2026-09-10). It reads Cargo.lock,
  # nothing more, so it is also the fastest job here.
  deny:
    name: Dependencies
    # See the `checks` job: skipped while the repository is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
