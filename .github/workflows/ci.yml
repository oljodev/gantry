name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres is unused in Phase 0 but wired up now: Phase 1's queue
    # concurrency tests require a real PG (SKIP LOCKED has no SQLite analog).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gantry
          POSTGRES_PASSWORD: gantry
          POSTGRES_DB: gantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gantry"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      GANTRY_ENV: test
      GANTRY_DATABASE_URL: postgresql+asyncpg://gantry:gantry@localhost:5432/gantry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests migrations
          uv run ruff format --check src tests migrations

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run check

      - name: Build
        run: npm run build
